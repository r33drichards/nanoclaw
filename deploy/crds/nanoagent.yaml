apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nanoagents.nanoclaw.io
spec:
  group: nanoclaw.io
  scope: Namespaced
  names:
    kind: NanoAgent
    listKind: NanoAgentList
    plural: nanoagents
    singular: nanoagent
    shortNames:
      - na
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [provider]
              properties:
                displayName:
                  type: string
                provider:
                  type: string
                  enum: [claude, codex, opencode]
                model:
                  type: string
                effort:
                  type: string
                  enum: [low, medium, high, max, ultra]
                assistantName:
                  type: string
                maxMessagesPerPrompt:
                  type: integer
                  minimum: 1
                  default: 10
                imageTag:
                  type: string
                  description: |
                    Pre-built container image reference. The host does not build
                    per-agent images on the k8s runtime — operators pre-build and
                    push to a configured registry.
                cliScope:
                  type: string
                  enum: [disabled, group, global]
                  default: group
                skills:
                  oneOf:
                    - type: string
                      enum: [all]
                    - type: array
                      items:
                        type: string
                  default: all
                packages:
                  type: object
                  properties:
                    apt:
                      type: array
                      items:
                        type: string
                      default: []
                    npm:
                      type: array
                      items:
                        type: string
                      default: []
                mcpServers:
                  type: object
                  additionalProperties:
                    type: object
                    required: [command]
                    properties:
                      command:
                        type: string
                      args:
                        type: array
                        items:
                          type: string
                      env:
                        type: object
                        additionalProperties:
                          type: string
                      instructions:
                        type: string
                additionalMounts:
                  type: array
                  items:
                    type: object
                    required: [containerPath]
                    properties:
                      hostPath:
                        type: string
                        description: |
                          On k8s this is interpreted as a Secret or ConfigMap
                          name to project (resolution rules documented in the
                          chart). The controller refuses raw hostPath mounts.
                      containerPath:
                        type: string
                      readonly:
                        type: boolean
                        default: true
                destinations:
                  type: array
                  description: |
                    Where this agent is allowed to send messages.
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name:
                        type: string
                      displayName:
                        type: string
                      type:
                        type: string
                        enum: [channel, agent]
                      channelType:
                        type: string
                      platformId:
                        type: string
                      agentRef:
                        type: string
                members:
                  type: array
                  description: |
                    Platform identities granted unprivileged access.
                  items:
                    type: string
                warmPool:
                  type: object
                  description: |
                    Maps to a SandboxWarmPool. Pre-warms N idle Sandboxes so
                    the next conversation wakes sub-second.
                  properties:
                    replicas:
                      type: integer
                      minimum: 0
                      default: 0
                allowedEgress:
                  type: array
                  description: |
                    Hostnames the agent is permitted to reach directly (i.e.
                    not via OneCLI). Egress to anything else is denied by
                    the controller-managed NetworkPolicy.
                  items:
                    type: string
            status:
              type: object
              properties:
                sandboxTemplateRef:
                  type: string
                warmPoolRef:
                  type: string
                resolvedImageTag:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Model
          type: string
          jsonPath: .spec.model
        - name: Image
          type: string
          jsonPath: .status.resolvedImageTag
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
