apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nanoapprovals.nanoclaw.io
spec:
  group: nanoclaw.io
  scope: Namespaced
  names:
    kind: NanoApproval
    listKind: NanoApprovalList
    plural: nanoapprovals
    singular: nanoapproval
    shortNames:
      - napp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [kind, payload]
              properties:
                kind:
                  type: string
                  enum:
                    - credential
                    - sender
                    - self-modification
                    - container-restart
                agentRef:
                  type: string
                  description: NanoAgent the approval relates to, if any.
                sessionRef:
                  type: string
                payload:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: |
                    Kind-specific request body. Schema is enforced at the
                    application layer (host writes / controller validates).
                requestedAt:
                  type: string
                  format: date-time
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Approved, Denied, Expired]
                decidedBy:
                  type: string
                decidedAt:
                  type: string
                  format: date-time
                deliveryRefs:
                  type: array
                  description: |
                    Message-out ids the host generated to render this
                    approval. Cleared on terminal phase.
                  items:
                    type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Agent
          type: string
          jsonPath: .spec.agentRef
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
