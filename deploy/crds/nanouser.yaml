apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nanousers.nanoclaw.io
spec:
  group: nanoclaw.io
  scope: Cluster
  names:
    kind: NanoUser
    listKind: NanoUserList
    plural: nanousers
    singular: nanouser
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [identity]
              properties:
                identity:
                  type: string
                  pattern: '^[a-z][a-z0-9-]*:.+$'
                  description: |
                    Platform identity in the form `<channel>:<handle>`,
                    e.g. `discord:123456789` or `telegram:42`.
                kind:
                  type: string
                  enum: [user, bot, system]
                  default: user
                displayName:
                  type: string
                roles:
                  type: array
                  description: |
                    Roles granted to this user. Owner is global only.
                  items:
                    type: object
                    required: [role]
                    properties:
                      role:
                        type: string
                        enum: [owner, admin, member]
                      scope:
                        type: string
                        description: |
                          NanoAgent name (namespace/name). Omit for global
                          scope. Owner is always global; admin can be either.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Identity
          type: string
          jsonPath: .spec.identity
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
