apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-host
  labels:
    {{- include "nanoclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: host
spec:
  type: ClusterIP
  selector:
    {{- include "nanoclaw.host.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: webhook
      port: 8081
      targetPort: webhook
